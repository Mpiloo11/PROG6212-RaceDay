name: RaceDay Part 1 Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.png
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql

      - name: Check required folders
        run: |
          test -d docs
          test -d .github/workflows

      - name: Validation successful
        run: echo "RaceDay Part 1 repository validation passed."
